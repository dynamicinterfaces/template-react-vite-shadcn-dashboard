<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Integrations</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f11; color: #e4e4e7; font-family: 'Inter', system-ui, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header { padding: 24px 32px 0; }
  header h1 { font-size: 22px; font-weight: 600; color: #fff; }
  header p { font-size: 13px; color: #71717a; margin-top: 4px; }
  svg { flex: 1; width: 100%; }

  .node-label { font-size: 12px; font-weight: 600; fill: #e4e4e7; }
  .node-sub   { font-size: 10px; fill: #71717a; }
  .badge      { font-size: 10px; font-weight: 700; }

  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .flow-dot { animation: flowAnim 2s linear infinite; }
  @keyframes flowAnim { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }

  .source-group:hover .source-rect { filter: brightness(1.3); }
</style>
</head>
<body>
<header>
  <h1>Data Integrations</h1>
  <p>Live data flow from sources into the Dynamic Interfaces graph</p>
</header>
<svg id="canvas" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3f3f46" />
    </marker>
    <marker id="arrow-active" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sources column (left) -->
  <!-- HubSpot -->
  <g class="source-group" transform="translate(40, 40)">
    <rect class="source-rect" rx="10" width="140" height="52" fill="#1c1c1f" stroke="#ff7a45" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="10" fill="#ff7a45" opacity="0.2"/>
    <text x="20" y="30" text-anchor="middle" class="badge" fill="#ff7a45">HS</text>
    <text x="40" y="22" class="node-label">HubSpot CRM</text>
    <text x="40" y="36" class="node-sub">contacts · deals · companies</text>
  </g>

  <!-- QuickBooks -->
  <g class="source-group" transform="translate(40, 110)">
    <rect class="source-rect" rx="10" width="140" height="52" fill="#1c1c1f" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="10" fill="#22c55e" opacity="0.2"/>
    <text x="20" y="30" text-anchor="middle" class="badge" fill="#22c55e">QB</text>
    <text x="40" y="22" class="node-label">QuickBooks</text>
    <text x="40" y="36" class="node-sub">ledger · invoices · AP/AR</text>
  </g>

  <!-- Rippling -->
  <g class="source-group" transform="translate(40, 180)">
    <rect class="source-rect" rx="10" width="140" height="52" fill="#1c1c1f" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="10" fill="#a78bfa" opacity="0.2"/>
    <text x="20" y="30" text-anchor="middle" class="badge" fill="#a78bfa">RI</text>
    <text x="40" y="22" class="node-label">Rippling HR</text>
    <text x="40" y="36" class="node-sub">employees · payroll · roles</text>
  </g>

  <!-- Stripe -->
  <g class="source-group" transform="translate(40, 250)">
    <rect class="source-rect" rx="10" width="140" height="52" fill="#1c1c1f" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="10" fill="#6366f1" opacity="0.2"/>
    <text x="20" y="30" text-anchor="middle" class="badge" fill="#6366f1">ST</text>
    <text x="40" y="22" class="node-label">Stripe</text>
    <text x="40" y="36" class="node-sub">revenue · MRR · churn</text>
  </g>

  <!-- Salesforce -->
  <g class="source-group" transform="translate(40, 320)">
    <rect class="source-rect" rx="10" width="140" height="52" fill="#1c1c1f" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="10" fill="#38bdf8" opacity="0.2"/>
    <text x="20" y="30" text-anchor="middle" class="badge" fill="#38bdf8">SF</text>
    <text x="40" y="22" class="node-label">Salesforce</text>
    <text x="40" y="36" class="node-sub">pipeline · forecasts</text>
  </g>

  <!-- Snowflake -->
  <g class="source-group" transform="translate(40, 390)">
    <rect class="source-rect" rx="10" width="140" height="52" fill="#1c1c1f" stroke="#67e8f9" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="10" fill="#67e8f9" opacity="0.2"/>
    <text x="20" y="30" text-anchor="middle" class="badge" fill="#67e8f9">SN</text>
    <text x="40" y="22" class="node-label">Snowflake</text>
    <text x="40" y="36" class="node-sub">warehouse · analytics</text>
  </g>

  <!-- Pipeline engine (center) -->
  <g transform="translate(320, 190)">
    <rect rx="14" width="180" height="140" fill="#18181b" stroke="#6366f1" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">DI PIPELINE</text>
    <line x1="20" y1="36" x2="160" y2="36" stroke="#27272a" stroke-width="1"/>
    <text x="90" y="56" text-anchor="middle" font-size="10" fill="#a1a1aa">Parse &amp; normalize</text>
    <text x="90" y="74" text-anchor="middle" font-size="10" fill="#a1a1aa">Deduplicate &amp; enrich</text>
    <text x="90" y="92" text-anchor="middle" font-size="10" fill="#a1a1aa">Schema map → graph</text>
    <text x="90" y="110" text-anchor="middle" font-size="10" fill="#a1a1aa">Diff &amp; sync to Yjs</text>
    <circle cx="90" cy="128" r="6" fill="#6366f1" class="pulse" filter="url(#glow)"/>
  </g>

  <!-- DI Canvas (right) -->
  <g transform="translate(600, 80)">
    <rect rx="14" width="180" height="360" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1">DI CANVAS</text>
    <line x1="16" y1="36" x2="164" y2="36" stroke="#27272a" stroke-width="1"/>

    <!-- Canvas node pills -->
    <g transform="translate(16, 48)">
      <rect rx="6" width="148" height="36" fill="#1c1c1f" stroke="#ff7a45" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" font-size="10" fill="#ff7a45" font-weight="600">Sales &amp; CRM</text>
      <text x="74" y="32" text-anchor="middle" font-size="9" fill="#71717a">84 deals · 4 accounts</text>
    </g>
    <g transform="translate(16, 96)">
      <rect rx="6" width="148" height="36" fill="#1c1c1f" stroke="#22c55e" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="600">Accounting</text>
      <text x="74" y="32" text-anchor="middle" font-size="9" fill="#71717a">P&amp;L · Cash Flow · AR</text>
    </g>
    <g transform="translate(16, 144)">
      <rect rx="6" width="148" height="36" fill="#1c1c1f" stroke="#a78bfa" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" font-size="10" fill="#a78bfa" font-weight="600">People &amp; HR</text>
      <text x="74" y="32" text-anchor="middle" font-size="9" fill="#71717a">142 headcount · 19 open</text>
    </g>
    <g transform="translate(16, 192)">
      <rect rx="6" width="148" height="36" fill="#1c1c1f" stroke="#6366f1" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" font-size="10" fill="#6366f1" font-weight="600">Financials</text>
      <text x="74" y="32" text-anchor="middle" font-size="9" fill="#71717a">MRR · ARR · Runway</text>
    </g>
    <g transform="translate(16, 240)">
      <rect rx="6" width="148" height="36" fill="#1c1c1f" stroke="#38bdf8" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" font-size="10" fill="#38bdf8" font-weight="600">Operations</text>
      <text x="74" y="32" text-anchor="middle" font-size="9" fill="#71717a">8 systems · 34 workflows</text>
    </g>
    <g transform="translate(16, 288)">
      <rect rx="6" width="148" height="36" fill="#1c1c1f" stroke="#f59e0b" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="600">Intelligence</text>
      <text x="74" y="32" text-anchor="middle" font-size="9" fill="#71717a">4 insights · 5 signals</text>
    </g>
  </g>

  <!-- Arrows: sources → pipeline -->
  <line x1="180" y1="66"  x2="320" y2="230" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3" class="flow-dot"/>
  <line x1="180" y1="136" x2="320" y2="245" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3" class="flow-dot" style="animation-delay:0.3s"/>
  <line x1="180" y1="206" x2="320" y2="258" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3" class="flow-dot" style="animation-delay:0.6s"/>
  <line x1="180" y1="276" x2="320" y2="262" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3" class="flow-dot" style="animation-delay:0.9s"/>
  <line x1="180" y1="346" x2="320" y2="270" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3" class="flow-dot" style="animation-delay:1.2s"/>
  <line x1="180" y1="416" x2="320" y2="280" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3" class="flow-dot" style="animation-delay:1.5s"/>

  <!-- Arrow: pipeline → canvas -->
  <line x1="500" y1="260" x2="600" y2="260" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-active)" filter="url(#glow)"/>
  <text x="550" y="252" text-anchor="middle" font-size="9" fill="#6366f1">graph sync</text>
</svg>
</body>
</html>
